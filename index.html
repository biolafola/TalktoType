<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalkToType - Voice to Text</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .mic-button {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        #startBtn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        #startBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
        }

        #startBtn.listening {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.7);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(245, 87, 108, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(245, 87, 108, 0);
            }
        }

        #startBtn svg {
            width: 40px;
            height: 40px;
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
            color: #666;
            min-height: 24px;
        }

        .status.listening {
            color: #f5576c;
        }

        .output-container {
            position: relative;
        }

        #output {
            width: 100%;
            min-height: 200px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        #output:focus {
            outline: none;
            border-color: #667eea;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn-copy {
            background: #667eea;
            color: white;
        }

        .btn-copy:hover {
            background: #5a6fd6;
        }

        .btn-clear {
            background: #e0e0e0;
            color: #333;
        }

        .btn-clear:hover {
            background: #d0d0d0;
        }

        .error {
            background: #fff3f3;
            border: 1px solid #ffcdd2;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .browser-support {
            text-align: center;
            color: #999;
            font-size: 0.8rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TalkToType</h1>
        <p class="subtitle">Click the microphone and start speaking</p>

        <div id="error" class="error"></div>

        <div class="mic-button">
            <button id="startBtn" title="Click to start recording">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
        </div>

        <p id="status" class="status">Click the microphone to start</p>

        <div class="output-container">
            <textarea id="output" placeholder="Your transcribed text will appear here..."></textarea>
            <div class="controls">
                <button class="btn btn-clear" id="clearBtn">Clear</button>
                <button class="btn btn-copy" id="copyBtn">Copy Text</button>
            </div>
        </div>

        <p class="browser-support">Works best in Chrome, Edge, or Safari</p>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const errorDiv = document.getElementById('error');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');

        let recognition = null;
        let isListening = false;

        // Check browser support
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            showError('Your browser does not support speech recognition. Please use Chrome, Edge, or Safari.');
            startBtn.disabled = true;
        } else {
            // Initialize speech recognition
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();

            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            let finalTranscript = '';

            recognition.onstart = () => {
                isListening = true;
                startBtn.classList.add('listening');
                status.textContent = 'Listening...';
                status.classList.add('listening');
                hideError();
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                output.value = finalTranscript + interimTranscript;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);

                let errorMessage = 'An error occurred. ';
                switch (event.error) {
                    case 'no-speech':
                        errorMessage = 'No speech detected. Please try again.';
                        break;
                    case 'audio-capture':
                        errorMessage = 'No microphone found. Please check your microphone settings.';
                        break;
                    case 'not-allowed':
                        errorMessage = 'Microphone access denied. Please allow microphone access and try again.';
                        break;
                    case 'network':
                        errorMessage = 'Network error. Please check your internet connection.';
                        break;
                    default:
                        errorMessage += event.error;
                }

                showError(errorMessage);
                stopListening();
            };

            recognition.onend = () => {
                if (isListening) {
                    // Restart if still supposed to be listening
                    recognition.start();
                } else {
                    startBtn.classList.remove('listening');
                    status.textContent = 'Click the microphone to start';
                    status.classList.remove('listening');
                }
            };
        }

        startBtn.addEventListener('click', () => {
            if (!recognition) return;

            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        });

        function startListening() {
            try {
                recognition.start();
            } catch (e) {
                console.error('Error starting recognition:', e);
            }
        }

        function stopListening() {
            isListening = false;
            recognition.stop();
            startBtn.classList.remove('listening');
            status.textContent = 'Click the microphone to start';
            status.classList.remove('listening');
        }

        copyBtn.addEventListener('click', () => {
            output.select();
            document.execCommand('copy');

            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copied!';
            setTimeout(() => {
                copyBtn.textContent = originalText;
            }, 2000);
        });

        clearBtn.addEventListener('click', () => {
            output.value = '';
            if (recognition) {
                finalTranscript = '';
            }
        });

        // Fix for clear button - need to reset finalTranscript
        clearBtn.addEventListener('click', () => {
            output.value = '';
            // Reset the finalTranscript in the closure
            if (recognition) {
                stopListening();
                setTimeout(() => {
                    // Reinitialize to reset transcript
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    const newRecognition = new SpeechRecognition();

                    newRecognition.continuous = true;
                    newRecognition.interimResults = true;
                    newRecognition.lang = 'en-US';

                    let finalTranscript = '';

                    newRecognition.onstart = recognition.onstart;
                    newRecognition.onerror = recognition.onerror;

                    newRecognition.onresult = (event) => {
                        let interimTranscript = '';

                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            const transcript = event.results[i][0].transcript;
                            if (event.results[i].isFinal) {
                                finalTranscript += transcript + ' ';
                            } else {
                                interimTranscript += transcript;
                            }
                        }

                        output.value = finalTranscript + interimTranscript;
                    };

                    newRecognition.onend = () => {
                        if (isListening) {
                            newRecognition.start();
                        } else {
                            startBtn.classList.remove('listening');
                            status.textContent = 'Click the microphone to start';
                            status.classList.remove('listening');
                        }
                    };

                    recognition = newRecognition;
                }, 100);
            }
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            errorDiv.style.display = 'none';
        }
    </script>
</body>
</html>
